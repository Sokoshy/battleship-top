<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battleship</title>
    <link href="css/style.css" rel="stylesheet">
    <script src="main.js" type="module" defer></script>
  </head>
  <body>
  <main>
    <div id="setup-panel">
      <p id="setup-status">Place your Carrier (5 cells) — click a cell on your board.</p>
      <button id="orient-btn" type="button">Orientation: Horizontal</button>
      <button id="random-btn" type="button">Random placement</button>
      <button id="start-btn" type="button" disabled>Start game</button>
    </div>
    <div id="player"></div>
    <div id="opponent"></div>
  </main>
  </body>
</html>
